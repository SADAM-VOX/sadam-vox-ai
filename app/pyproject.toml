[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sadam-vox-ai"
version = "1.0.0"
description = "Professional AI Audio Studio Engine"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "SADAM VOX" }
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.35.0",
    "python-multipart>=0.0.20",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "numpy>=2.3.0",
    "scipy>=1.16.0",
    "librosa>=0.11.0",
    "soundfile>=0.13.0",
    "ffmpeg-python>=0.2.0",
    "pedalboard>=0.9.17",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "transformers>=4.55.0",
    "openai-whisper>=20250625",
    "demucs>=4.0.1",
    "deepfilternet>=0.5.6",
    "python-dotenv>=1.1.1",
    "loguru>=0.7.3"
]

[tool.setuptools]
include-package-data = true
